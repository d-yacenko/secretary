name: personal_secretary
description: Personal Secretary OS client (Android + Linux)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  record: ^6.0.0
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  desktop_drop: ^0.5.0
  crypto: ^3.0.6
  path: ^1.9.1
  csv: ^6.0.0
  flutter_timezone: ^4.1.0
  flutter_markdown: ^0.7.6
  archive: ^4.0.7
  xml: ^6.5.0
  dart_duckdb: ^1.4.4
  syncfusion_flutter_pdf: ^33.2.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
